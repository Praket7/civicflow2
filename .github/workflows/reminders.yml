name: Reminder dispatch

# The database has no scheduler of its own on this plan. This job is the
# clock: it asks the dispatcher to generate and send whatever is due.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch due reminders
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice title=Reminder dispatch skipped::Set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets to run the dispatch clock."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Invoke the dispatcher
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$SUPABASE_URL/functions/v1/dispatch-reminders?limit=100" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
