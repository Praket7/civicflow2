[package]
name = "civicflow-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
description = "CivicFlow domain rules, SQLite persistence, and read models"
license = "MIT"

[dependencies]
# SQLCipher, with OpenSSL built from source so no machine needs a system
# installation. The database file is unreadable without the key the desktop
# keeps in the operating system credential store.
rusqlite = { version = "0.37", features = [
    "bundled-sqlcipher-vendored-openssl",
    "backup",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
proptest = "1"
